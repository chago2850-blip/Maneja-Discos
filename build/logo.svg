<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#3730A3"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="platter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#tile)"><rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/></g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <circle cx="512" cy="470" r="420" fill="#FFFFFF" opacity="0.04"/>
  </g>

  <!-- Platter -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="470" r="262" fill="url(#platter)"/>
  </g>
  <!-- Partition ring: three segments (data map) -->
  <g fill="none" stroke-width="58" stroke-linecap="butt" transform="rotate(-90 512 470)">
    <circle cx="512" cy="470" r="200" stroke="#3B82F6" stroke-dasharray="560 697" stroke-dashoffset="0"/>
    <circle cx="512" cy="470" r="200" stroke="#F59E0B" stroke-dasharray="330 927" stroke-dashoffset="-578"/>
    <circle cx="512" cy="470" r="200" stroke="#14B8A6" stroke-dasharray="314 943" stroke-dashoffset="-926"/>
  </g>
  <!-- Tracks -->
  <circle cx="512" cy="470" r="138" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-width="4"/>
  <circle cx="512" cy="470" r="112" fill="none" stroke="#6366F1" stroke-opacity="0.18" stroke-width="4"/>
  <!-- Hub -->
  <circle cx="512" cy="470" r="70" fill="url(#hub)"/>
  <circle cx="512" cy="470" r="26" fill="#312E81"/>

  <!-- Read head arm -->
  <g filter="url(#shadow)">
    <path d="M742 726 L604 560" stroke="#E2E8F0" stroke-width="34" stroke-linecap="round"/>
    <circle cx="742" cy="726" r="44" fill="#E2E8F0"/>
    <circle cx="742" cy="726" r="18" fill="#94A3B8"/>
    <rect x="574" y="528" width="52" height="40" rx="10" transform="rotate(-50 600 548)" fill="#F59E0B"/>
  </g>

  <!-- Bottom partition bar -->
  <g transform="translate(232 790)">
    <rect width="560" height="44" rx="22" fill="#000" opacity="0.25"/>
    <rect x="6" y="6" width="244" height="32" rx="16" fill="#3B82F6"/>
    <rect x="256" y="6" width="150" height="32" rx="8" fill="#F59E0B"/>
    <rect x="412" y="6" width="142" height="32" rx="16" fill="#14B8A6"/>
  </g>
</svg>
